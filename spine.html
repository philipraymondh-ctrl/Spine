<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#DCE2DB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spine">
<title>Spine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600&display=swap">
<style>
:root {
  --bg:      #DCE2DB;
  --surface: #EDF0EA;
  --ink:     #1F2A24;
  --ink-dim: #4F5D52;   /* 5.24:1 on --bg; was #5D6C60 at 4.22:1, failing AA */
  --accent:  #26507E;
  --warn:    #8C3A2B;

  --font-display: 'Archivo Narrow', system-ui, sans-serif;
  --font-body: system-ui, -apple-system, 'Segoe UI', sans-serif;
  --t-xs: 0.75rem; --t-sm: 0.875rem; --t-md: 1rem;
  --t-lg: 1.375rem; --t-xl: 2.25rem;

  --s1: 4px; --s2: 8px; --s3: 16px;
  --s4: 24px; --s5: 40px; --s6: 64px;

  --radius: 2px;
  --line: 1px solid var(--rule);
  --measure: 68ch;

  /* Control boundaries were 1.14-1.58:1 — nothing said where a button began. */
  --edge: #8E978F;      /* 3.03:1 on --bg, meets 1.4.11 for non-text contrast */
  --rule: color-mix(in srgb, var(--ink) 12%, transparent);

  /* Motion vocabulary. There is almost none of it on purpose: all boldness is
     spent on the strike, so everything else stays still. */
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --dur-settle: 320ms;   /* the strike landing — the one moment with weight */
  --dur-quick: 180ms;    /* bridging a layout swap so it does not teleport */

  --strike-weight: 2px;
  --strike-tilt: -0.8deg;
  --strike-color: var(--warn);
}

/* The ritual is meant to run at the start and end of a day. Light-only made
   the evening half of that hostile. Same ledger, lower lamp. */
@media (prefers-color-scheme: dark) {
  :root {
    --bg:      #1A211C;
    --surface: #222A24;
    --ink:     #E4EAE2;
    --ink-dim: #9EAAA0;
    --accent:  #8FB6E0;
    --warn:    #E08A72;
    --edge:    #67736A;
    --rule: color-mix(in srgb, var(--ink) 18%, transparent);
  }
}

/* Reduced motion is reduced, not removed. A struck commitment must still
   register — blanking the transition entirely would take the one piece of
   feedback this product deliberately spends its weight on. The rotation and
   the breathing pulse go; the colour landing stays, shorter. */
@media (prefers-reduced-motion: reduce) {
  :root { --dur-settle: 120ms; --dur-quick: 1ms; }
  .entry.is-struck.just-struck > .l { transform: rotate(var(--strike-tilt)); }
  .verdict[data-waiting] { animation: none; }
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

html { background: var(--bg); color-scheme: light dark; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--t-md);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
}

h1, h2 {
  font-family: var(--font-display);
  font-weight: 600;
  letter-spacing: 0.02em;
  margin: 0;
}

/* Focus is never removed, only restyled. */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

button, input, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

.wrap {
  max-width: var(--measure);
  margin: 0 auto;
  padding: var(--s4) var(--s3) var(--s6);
}

.screen { display: none; }
.screen.on { display: block; }

.eyebrow {
  font-family: var(--font-display);
  font-size: var(--t-xs);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-dim);
  margin: 0 0 var(--s2);
}

.hint {
  font-size: var(--t-sm);
  color: var(--ink-dim);
  margin: var(--s2) 0 0;
}

/* ---------- controls ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: var(--s2) var(--s4);
  background: var(--surface);
  border: 1px solid var(--edge);
  border-radius: var(--radius);
  cursor: pointer;
  font-size: var(--t-md);
  text-align: center;
}
.btn:hover { background: color-mix(in srgb, var(--ink) 5%, var(--surface)); }
.btn:disabled { opacity: 0.5; cursor: default; }

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--surface);
}
.btn-primary:hover { background: color-mix(in srgb, #000 12%, var(--accent)); }

.btn-warn { color: var(--warn); border-color: var(--warn); }

.btn-block { display: flex; width: 100%; }

.row {
  display: flex;
  gap: var(--s2);
  flex-wrap: wrap;
}
.row > .btn { flex: 1 1 auto; }

input[type="text"], input[type="password"], textarea {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--edge);
  border-radius: var(--radius);
  padding: var(--s2) var(--s3);
  min-height: 44px;
}
textarea { resize: vertical; line-height: 1.6; }

.banner {
  border-left: 2px solid var(--warn);
  background: var(--surface);
  color: var(--warn);
  padding: var(--s2) var(--s3);
  font-size: var(--t-sm);
  margin-bottom: var(--s3);
}

/* ---------- screen 1: dump ---------- */

#dump-text {
  min-height: 46dvh;
  font-size: var(--t-md);
}

/* ---------- screen 2: order ---------- */

.choice {
  display: block;
  width: 100%;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--edge);
  border-radius: var(--radius);
  padding: var(--s3);
  margin-bottom: var(--s2);
  cursor: pointer;
  min-height: 44px;
}
.choice:hover { border-color: var(--accent); }
.choice .t {
  font-family: var(--font-display);
  font-size: var(--t-lg);
  line-height: 1.25;
  display: block;
}
.choice .c {
  display: block;
  margin-top: var(--s1);
  font-size: var(--t-sm);
  color: var(--ink-dim);
}

/* ---------- screen 3: today ---------- */

/* v2 used min-height:42dvh, so on any normal desktop the whole ledger sat in
   the first screen and the "one thing on an empty page" idea did not exist.
   The action must own the viewport; the ledger is reached by scrolling. */
.today {
  min-height: calc(100dvh - var(--s6));
  padding-top: 12dvh;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

.action-line {
  font-family: var(--font-display);
  font-size: var(--t-xl);
  font-weight: 600;
  line-height: 1.15;
  margin: 0;
  overflow-wrap: break-word;
}

/* The consequence: the model's headline output, previously collected and never
   shown. It is the evidence for the order the user is being asked to trust. */
.because {
  font-size: var(--t-md);
  color: var(--ink-dim);
  margin: var(--s3) 0 0;
  max-width: 46ch;
}

.count {
  font-family: var(--font-body);
  font-size: var(--t-xs);
  letter-spacing: 0;
  text-transform: none;
  color: var(--ink-dim);
  margin-left: var(--s2);
}

.row-wide { gap: var(--s4); }

/* Two buttons vanish and three chips take their place; without a bridge the
   layout simply jumps. */
.reason-row {
  transition: opacity var(--dur-quick) var(--ease-out),
              transform var(--dur-quick) var(--ease-out);
}
.reason-row.entering { opacity: 0; transform: translateY(-4px); }

.btn-link, .add-new {
  display: inline-block;
  margin-top: var(--s3);
  min-height: 44px;
  padding: var(--s2) 0;
  background: none;
  border: 0;
  color: var(--ink-dim);
  text-decoration: underline;
  cursor: pointer;
  font-size: var(--t-sm);
}

.blocked {
  font-size: var(--t-sm);
  color: var(--ink-dim);
  margin: var(--s3) 0 0;
}

.verdict {
  background: var(--surface);
  border-left: 2px solid var(--warn);
  padding: var(--s3);
  margin: var(--s4) 0 var(--s3);
}
.verdict p { margin: 0; }

/* Up to 45 seconds of static text at the moment the user is braced for a
   judgement reads as a crash. Breathe the rule, not the words — and never a
   spinner, which implies progress that cannot be measured. */
@keyframes breathe {
  0%, 100% { border-left-color: var(--warn); }
  50%      { border-left-color: color-mix(in srgb, var(--warn) 40%, var(--surface)); }
}
.verdict[data-waiting] { animation: breathe 1600ms ease-in-out infinite; }
.verdict .rec {
  margin-top: var(--s2);
  font-size: var(--t-xs);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-dim);
}

/* ---------- the ledger ---------- */

.ledger { margin-top: var(--s6); border-top: var(--line); }

.ledger h2 {
  font-size: var(--t-xs);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-dim);
  padding-top: var(--s3);
  margin-bottom: var(--s2);
}

.entries { list-style: none; margin: 0; padding: 0; }

.entry {
  position: relative;
  padding: var(--s2) 0;
  border-bottom: var(--line);
  font-size: var(--t-sm);
  display: grid;
  grid-template-columns: 1fr auto;
  column-gap: var(--s3);
}
.entry .l { grid-column: 1; }
.entry .state {
  grid-column: 2;
  align-self: start;
  font-size: var(--t-xs);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-dim);
}
.entry .why { grid-column: 1 / -1; }
.entry .n {
  color: var(--ink-dim);
  font-variant-numeric: tabular-nums;
  margin-right: var(--s2);
}
.entry .why {
  display: block;
  color: var(--ink-dim);
  font-size: var(--t-xs);
  margin-top: var(--s1);
}
.entry.at { color: var(--accent); }

/* Three settled states, three different marks. v2 gave done and struck the
   same red rule, so a finished week and a collapsed one were the same page —
   and the product's claim that what you kept stays as legible as what you
   struck was contradicted by its own ledger. */
.entry.ruled > .l { color: var(--ink-dim); }

/* Done: settled, quiet, ticked. No correction mark — nothing was corrected. */
.entry.is-done > .l::before { content: "\2713\00a0"; color: var(--accent); }

/* Struck: the signature. Correction red, ruled through, at an angle. Drawn as
   a line-through on a block-level box so it survives a wrapped title — as a
   positioned pseudo-element it collapsed to a stub on the second line. */
.entry.is-struck > .l {
  display: inline-block;
  text-decoration: line-through var(--strike-color) var(--strike-weight);
  text-decoration-skip-ink: none;
  transform: rotate(var(--strike-tilt));
  transform-origin: left center;
  transition: text-decoration-color var(--dur-settle) var(--ease-out),
              transform var(--dur-settle) var(--ease-out);
}

/* The frame the rule arrives on. A left-to-right draw would need a positioned
   pseudo-element, which collapsed to a stub on wrapped titles — see
   docs/AUDIT.md. text-decoration-color is animatable and survives the wrap,
   so the rule lands rather than draws. */
.entry.is-struck.just-struck > .l {
  text-decoration-color: transparent;
  transform: rotate(0deg);
}

/* Kept: not finished, not killed. Held open against a named person. */
.entry.is-kept > .l { border-left: 2px solid var(--accent); padding-left: var(--s2); }
.entry.is-kept > .state { color: var(--accent); }

.entry.at > .state { color: var(--accent); font-weight: 600; }
.entry.at > .l { font-weight: 600; color: var(--ink); }

.empty { color: var(--ink-dim); font-size: var(--t-sm); padding: var(--s3) 0; }

.closed {
  background: var(--surface);
  border: var(--line);
  padding: var(--s4);
  text-align: center;
}
.closed h1 { margin: 0 0 var(--s3); font-size: var(--t-lg); }
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ key ============ -->
  <section id="s-key" class="screen">
    <p class="eyebrow">Spine</p>
    <div id="key-banner"></div>
    <h1 style="font-size:var(--t-lg);margin-bottom:var(--s3)">Paste your Anthropic API key. It stays on this device.</h1>
    <input type="password" id="key-input" autocomplete="off" spellcheck="false" aria-label="Anthropic API key">
    <div style="margin-top:var(--s3)">
      <button class="btn btn-primary btn-block" id="key-save">Save key</button>
    </div>
  </section>

  <!-- ============ 1. dump ============ -->
  <section id="s-dump" class="screen">
    <p class="eyebrow" id="dump-eyebrow">Dump</p>
    <div id="dump-banner"></div>
    <textarea id="dump-text" aria-label="Everything you're carrying"
      placeholder="Everything you're carrying. Prose, fragments, half-sentences. Don't organise it."></textarea>
    <div style="margin-top:var(--s3)">
      <button class="btn btn-primary btn-block" id="dump-go">Extract items</button>
    </div>
    <div id="dump-cancel"></div>
  </section>

  <!-- ============ 2. order ============ -->
  <section id="s-order" class="screen">
    <p class="eyebrow" id="order-progress">Order</p>
    <h1 style="font-size:var(--t-lg);margin-bottom:var(--s4)">Which one hurts more if it slips?</h1>
    <button class="choice" id="pick-a"><span class="t"></span><span class="c"></span></button>
    <button class="choice" id="pick-b"><span class="t"></span><span class="c"></span></button>
  </section>

  <!-- ============ 3. today ============ -->
  <section id="s-today" class="screen">
    <div id="today-banner"></div>
    <div class="today" id="today-body" aria-live="polite"></div>
    <div class="ledger">
      <h2>Ledger <span id="ledger-count" class="count"></span></h2>
      <div id="ledger-body"></div>
    </div>
  </section>

</div>

<script>
"use strict";

/* ============================================================
   storage — three keys, version prefixed. Schema change = reset.
   ============================================================ */

const K_SETTINGS = "spine.v1.settings";
const K_CYCLE    = "spine.v1.cycle";
const K_ARCHIVE  = "spine.v1.archive";
const K_CARRIED  = "spine.v1.carried";

const MODEL = "claude-sonnet-5";
const API = "https://api.anthropic.com/v1/messages";

function read(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw === null ? fallback : JSON.parse(raw);
  } catch (e) {
    return fallback;
  }
}
/* Returns false when the write did not land. Callers that are about to delete
   the thing they just wrote MUST check it — see the cycle-close handler. */
function write(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (e) { return false; }
}

let settings = read(K_SETTINGS, null);
let cycle    = read(K_CYCLE, null);
let archive  = read(K_ARCHIVE, []);
let carriedForward = read(K_CARRIED, []);

/* Data written by an earlier version inferred "kept" from three deferrals on a
   live item. Make that explicit on load so the ledger stops asserting it. */
if (cycle && Array.isArray(cycle.items)) {
  cycle.items.forEach(i => {
    if (i.state === "live" && i.deferrals && i.deferrals.length >= 3 && i.id !== cycle.confrontingId) {
      i.state = "kept";
    }
  });
}

/* Every Done and every deferral lands here. v2 checked the write at cycle
   close and left this — the once-per-click path — unchecked, so under quota the
   ledger showed work that storage had silently refused. Callers must react. */
function saveCycle() {
  const ok = write(K_CYCLE, cycle);
  if (!ok) banner(todayBanner,
    "Out of storage — that last action was NOT saved. Free some space; nothing is lost yet.");
  return ok;
}

const today = () => new Date().toISOString().slice(0, 10);

/* The strike was reported as "witnessed by nobody". The literal reason is the
   fold: the ledger sits below the viewport, so the row the user just killed
   changes off-screen. Scrolling to it is the fix; the settle is what makes it
   land once it can be seen. */
let justStruckId = null;
const calmMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function uuid() {
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
}

/* ============================================================
   screens
   ============================================================ */

const screens = {
  key:   document.getElementById("s-key"),
  dump:  document.getElementById("s-dump"),
  order: document.getElementById("s-order"),
  today: document.getElementById("s-today")
};

const keyBanner = document.getElementById("key-banner");
const todayBanner = document.getElementById("today-banner");
const ledgerCount = document.getElementById("ledger-count");
const dumpEyebrow = document.getElementById("dump-eyebrow");
const dumpCancel = document.getElementById("dump-cancel");

function show(name) {
  for (const k in screens) screens[k].classList.toggle("on", k === name);
  window.scrollTo(0, 0);
}

function banner(el, text) {
  el.textContent = "";
  if (!text) return;
  const d = document.createElement("div");
  d.className = "banner";
  d.setAttribute("role", "status");
  d.textContent = text;
  el.appendChild(d);
}

/* ============================================================
   the model — one call path, never blocking the flow
   ============================================================ */

/* A hung connection must not strand the flow, so every call is on a clock.
   Errors carry .status so a rejected key can be told apart from a bad day. */
async function ask(system, user, maxTokens, timeoutMs) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeoutMs);
  try {
    const res = await fetch(API, {
      method: "POST",
      signal: ctl.signal,
      headers: {
        "content-type": "application/json",
        "x-api-key": settings.apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: maxTokens,
        system: system,
        messages: [{ role: "user", content: user }]
      })
    });
    if (!res.ok) {
      const err = new Error("http " + res.status);
      err.status = res.status;
      throw err;
    }
    const data = await res.json();
    const block = (data.content || []).find(b => b && b.type === "text");
    if (!block) throw new Error("no text");
    return block.text;
  } finally {
    clearTimeout(timer);
  }
}

const rejectedKey = e => e && (e.status === 401 || e.status === 403);

/* Only strip fences at the boundaries — a consequence may legitimately quote
   one, and a global strip would silently eat it. */
function unfence(text) {
  return String(text).trim()
    .replace(/^```(?:json)?\s*/i, "")
    .replace(/\s*```$/, "")
    .trim();
}

const SYS_EXTRACT =
`You convert a messy prose dump of someone's obligations into discrete units.
Return ONLY a JSON array. No preamble, no markdown fences, no commentary.
Each element: {"title","action","blockedOn","consequence"}
- title: under 6 words.
- action: the next single physical action. A verb someone could do in one sitting. Never "think about", "review", "consider", "plan".
- blockedOn: a named person if the dump implies one is required, else "".
- consequence: what concretely breaks if this slips two weeks. If nothing breaks, write "Nothing breaks."
Do not merge distinct obligations. Do not invent obligations not present in the input.
If the input contains no obligations, return [].`;

const SYS_VERDICT =
`Return ONLY JSON: {"verdict":"...","recommend":"strike"|"keep"}
verdict: two sentences maximum, addressed to the person, no hedging.
Given an item deferred three times with its stated reasons, say plainly whether this is
(a) not actually a commitment, or (b) genuinely blocked on another person.
Recommend "keep" only if the deferral reasons name a specific external dependency.`;

function newItem(fields) {
  return {
    id: uuid(),
    title: fields.title,
    action: fields.action,
    blockedOn: fields.blockedOn,
    consequence: fields.consequence,
    deferrals: [],
    state: "live",
    struckReason: ""
  };
}

/* Returns null when the response could not be understood, and [] only when the
   model genuinely reported no obligations — which the prompt explicitly asks
   for. v2 collapsed the two, so a correct empty answer was announced as a
   failure and then had commitments invented for it. */
function parseExtraction(text) {
  const clean = unfence(text);
  const open = clean.indexOf("[");
  const close = clean.lastIndexOf("]");
  if (open === -1 || close <= open) return null;
  let arr;
  try { arr = JSON.parse(clean.slice(open, close + 1)); } catch (e) { return null; }
  if (!Array.isArray(arr)) return null;
  if (arr.length === 0) return [];

  const keys = ["title", "action", "blockedOn", "consequence"];
  const valid = arr
    .filter(el => el && typeof el === "object" && keys.every(k => typeof el[k] === "string"))
    .filter(el => el.title.trim() !== "" || el.action.trim() !== "")
    .map(newItem);

  // A non-empty array where nothing survived validation is malformed, not empty.
  return valid.length === 0 ? null : valid;
}

// Never block the flow on the model: raw lines, empty fields, and say so.
function fallbackSplit(raw) {
  return raw
    .split("\n")
    .map(l => l.replace(/^\s*[-*•\d.)\]]+\s*/, "").trim())
    .filter(l => l !== "")
    .map(l => newItem({
      title: l.length > 48 ? l.slice(0, 48) + "…" : l,
      action: l,
      blockedOn: "",
      consequence: ""
    }));
}

function parseVerdict(text) {
  const fallback = {
    verdict: "Deferred three times with no external blocker named.",
    recommend: "strike"
  };
  const clean = unfence(text);
  const open = clean.indexOf("{");
  const close = clean.lastIndexOf("}");
  if (open === -1 || close <= open) return fallback;
  let obj;
  try { obj = JSON.parse(clean.slice(open, close + 1)); } catch (e) { return fallback; }
  if (!obj || typeof obj.verdict !== "string" || obj.verdict.trim() === "") return fallback;
  return {
    verdict: obj.verdict,
    recommend: obj.recommend === "keep" ? "keep" : "strike"
  };
}

/* ============================================================
   1. dump
   ============================================================ */

let addMode = false;

function startAdd() {
  addMode = true;
  dumpText.value = "";
  dumpEyebrow.textContent = "Something new";
  dumpText.placeholder = "What came up? One thing or several.";
  dumpGo.textContent = "Place it in the spine";
  banner(dumpBanner,
    "Nothing already ranked will move. You will answer a few questions to place this against what is there.");
  // Changing your mind must not strand you on a screen with no exit.
  dumpCancel.textContent = "";
  const back = el("button", "btn-link", "Never mind");
  back.addEventListener("click", () => {
    leaveAddMode();
    dumpText.value = "";
    banner(dumpBanner, "");
    show("today");
    renderToday();
  });
  dumpCancel.appendChild(back);

  show("dump");
  dumpText.focus();
}

function leaveAddMode() {
  addMode = false;
  dumpCancel.textContent = "";
  dumpEyebrow.textContent = "Dump";
  dumpText.placeholder = "Everything you're carrying. Prose, fragments, half-sentences. Don't organise it.";
  dumpGo.textContent = "Extract items";
}

const dumpText = document.getElementById("dump-text");
const dumpGo = document.getElementById("dump-go");
const dumpBanner = document.getElementById("dump-banner");

dumpGo.addEventListener("click", async () => {
  const raw = dumpText.value;
  if (raw.trim() === "") { dumpText.focus(); return; }

  dumpGo.disabled = true;
  dumpGo.textContent = "Extracting…";
  banner(dumpBanner, "");

  let items = [];
  let failed = false;
  let empty = false;
  try {
    const parsed = parseExtraction(await ask(SYS_EXTRACT, raw, 4000, 90000));
    // The prompt tells the model to return [] when there are no obligations.
    // v2 called that a failure and then invented commitments from the text.
    if (parsed === null) throw new Error("unparseable");
    if (parsed.length === 0) empty = true;
    items = parsed;
  } catch (e) {
    // A rejected key is not a bad extraction. Say which one it is, and send
    // them to the one screen that can fix it — with the dump still in place.
    if (rejectedKey(e)) {
      dumpGo.disabled = false;
      dumpGo.textContent = "Extract items";
      settings = null;
      try { localStorage.removeItem(K_SETTINGS); } catch (err) { /* ignore */ }
      banner(keyBanner, "That key was rejected. Paste a working one — your dump is still here.");
      show("key");
      keyInput.focus();
      return;
    }
    failed = true;
  }
  if (empty) {
    dumpGo.disabled = false;
    dumpGo.textContent = addMode ? "Place it in the spine" : "Extract items";
    banner(dumpBanner, "No obligations found in that. Nothing has been lost — add more, or reword it.");
    dumpText.focus();
    return;
  }
  if (items.length === 0) { items = fallbackSplit(raw); failed = true; }

  // Items carried from the last cycle keep the deferrals they earned.
  if (carriedForward.length) {
    const norm = t => String(t || "").trim().toLowerCase();
    const byText = new Map(carriedForward.map(c => [norm(c.action), c]));
    items.forEach(it => {
      const prior = byText.get(norm(it.action)) || byText.get(norm(it.title));
      if (prior) {
        it.deferrals = prior.deferrals.slice();
        if (!it.blockedOn) it.blockedOn = prior.blockedOn || "";
      }
    });
    carriedForward = [];
    write(K_CARRIED, carriedForward);
  }

  dumpGo.disabled = false;
  dumpGo.textContent = addMode ? "Place it in the spine" : "Extract items";

  // Adding to a live spine: place the newcomers, leave everything else alone.
  if (addMode && cycle && cycle.orderedIds.length) {
    const fresh = items;
    dumpText.value = "";
    leaveAddMode();
    banner(dumpBanner, "");
    banner(todayBanner, failed
      ? "Extraction failed. The new items are raw — fill in the next action yourself." : "");
    await insertItems(fresh);
    return;
  }
  leaveAddMode();

  const now = new Date().toISOString();
  cycle = { id: now.slice(0, 10), startedAt: now, items: items, orderedIds: [], cursor: 0, confrontingId: null };
  if (!write(K_CYCLE, cycle)) {
    cycle = null;
    banner(dumpBanner,
      "Out of storage — the cycle could not be saved, so nothing was started. " +
      "Your dump is still here. Free some space and try again.");
    return;
  }

  banner(todayBanner,
    failed ? "Extraction failed. Items are raw — fill in the next action yourself." : "");

  dumpText.value = "";
  startOrdering();
});

/* ============================================================
   2. order — pairwise forced choice, merge-sorted
   ============================================================ */

const pickA = document.getElementById("pick-a");
const pickB = document.getElementById("pick-b");
const orderProgress = document.getElementById("order-progress");

let pending = null;   // resolve fn for the comparison in flight
let asked = 0;
let bound = 0;
let orderLabel = "Choice";   // "Choice" while ranking a cycle, "Placing" while inserting

// Merge sort's comparison count is data-dependent; this is its ceiling,
// so the walk can finish early but never overrun the stated total.
function comparisonBound(n) {
  if (n < 2) return 0;
  const k = Math.ceil(Math.log2(n));
  return n * k - Math.pow(2, k) + 1;
}

function paint(btn, item) {
  btn.querySelector(".t").textContent = item.title;
  btn.querySelector(".c").textContent = item.consequence;
}

function compare(a, b) {
  return new Promise(resolve => {
    orderProgress.textContent = orderLabel + " " + (asked + 1) + " of up to " + bound;
    paint(pickA, a);
    paint(pickB, b);
    pending = resolve;
  });
}

function choose(value) {
  if (!pending) return;
  const resolve = pending;
  pending = null;
  asked++;
  resolve(value);
}

// Hurts more sorts first.
pickA.addEventListener("click", () => choose(-1));
pickB.addEventListener("click", () => choose(1));

async function mergeSort(list) {
  if (list.length <= 1) return list;
  const mid = list.length >> 1;
  const left = await mergeSort(list.slice(0, mid));
  const right = await mergeSort(list.slice(mid));
  const out = [];
  let i = 0, j = 0;
  while (i < left.length && j < right.length) {
    if (await compare(left[i], right[j]) <= 0) out.push(left[i++]);
    else out.push(right[j++]);
  }
  while (i < left.length) out.push(left[i++]);
  while (j < right.length) out.push(right[j++]);
  return out;
}

async function startOrdering() {
  asked = 0;
  orderLabel = "Choice";
  bound = comparisonBound(cycle.items.length);

  if (cycle.items.length <= 1) {
    cycle.orderedIds = cycle.items.map(it => it.id);
    cycle.cursor = 0;
    saveCycle();
    show("today");
    renderToday();
    return;
  }

  show("order");
  const sorted = await mergeSort(cycle.items.slice());
  cycle.orderedIds = sorted.map(it => it.id);
  cycle.cursor = 0;
  saveCycle();
  show("today");
  renderToday();
}

/* ============================================================
   adding to a live spine — binary insertion
   ============================================================ */

/* A week is long and things arrive. Ranking a newcomer against everything
   would be re-ranking, which is the one thing this refuses — so the newcomer
   is placed by binary search against what is already there, and no pair that
   has already been decided is ever asked again. Nothing already ranked moves. */
async function insertItems(fresh) {
  // Today's item does not change. You committed to it this morning; a new
  // arrival takes effect from the next advance, not under your hands.
  const pinnedId = cycle.orderedIds[cycle.cursor] || null;

  const liveNow = () => cycle.orderedIds.filter(id => !settled(itemById(id)));

  asked = 0;
  orderLabel = "Placing";
  bound = fresh.reduce((t, _, i) => t + Math.ceil(Math.log2(liveNow().length + i + 1)) , 0) || 1;

  for (const item of fresh) {
    cycle.items.push(item);
    const live = liveNow().filter(id => id !== item.id);

    let lo = 0, hi = live.length;
    if (hi > 0) {
      show("order");
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        // -1 means the newcomer hurts more, so it sorts above the incumbent.
        if (await compare(item, itemById(live[mid])) <= 0) hi = mid; else lo = mid + 1;
      }
    }

    const at = lo < live.length
      ? cycle.orderedIds.indexOf(live[lo])
      : cycle.orderedIds.length;
    cycle.orderedIds.splice(at, 0, item.id);
  }

  // Keep the cursor on whatever it was already pointing at.
  if (pinnedId && cycle.orderedIds.includes(pinnedId)) {
    cycle.cursor = cycle.orderedIds.indexOf(pinnedId);
  }
  if (!availableNow(currentItem())) cycle.cursor = nextOpen(-1);

  saveCycle();
  show("today");
  renderToday();
  banner(todayBanner, fresh.length === 1
    ? "Placed. Nothing already ranked moved."
    : fresh.length + " placed. Nothing already ranked moved.");
}

/* ============================================================
   3. today
   ============================================================ */

const todayBody = document.getElementById("today-body");
const ledgerBody = document.getElementById("ledger-body");

function itemById(id) { return cycle.items.find(it => it.id === id) || null; }

function currentItem() {
  if (!cycle || cycle.cursor >= cycle.orderedIds.length) return null;
  return itemById(cycle.orderedIds[cycle.cursor]);
}

/* An item is settled once it is done, struck, or kept because it is blocked on
   someone. Keeping is only reachable at the third deferral, so three deferrals
   on a live item means "parked, waiting on a person" — nothing left to ask. */
/* Four states. "kept" is explicit now: v2 inferred it from three deferrals on a
   live item, which meant a reload during the confrontation silently recorded the
   lenient outcome the user was being made to choose. */
function settled(item) {
  return !item || item.state !== "live";
}

/* The screen is called Today and the button says Not today. Both were lies:
   deferring advanced immediately, so three deferrals could happen inside a
   minute and the verdict would announce a pattern of avoidance that never
   occurred. An item may now be deferred at most once per day. */
function deferredToday(item) {
  const last = item.deferrals[item.deferrals.length - 1];
  return !!last && String(last.date).slice(0, 10) === today();
}

function availableNow(item) {
  return !settled(item) && !deferredToday(item);
}

function openCount() {
  return cycle.orderedIds.filter(id => !settled(itemById(id))).length;
}

/* The cursor wraps. A single forward pass would let every item be deferred at
   most once, so the third-deferral rule below could never fire; the walk keeps
   coming back to whatever is still open until it is done, struck or parked. */
function nextOpen(from) {
  const n = cycle.orderedIds.length;
  for (let step = 1; step <= n; step++) {
    const idx = (from + step) % n;
    if (availableNow(itemById(cycle.orderedIds[idx]))) return idx;
  }
  return n; // nothing available — either the day is done or the cycle is
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function advance() {
  cycle.cursor = nextOpen(cycle.cursor);
  saveCycle();
  renderToday();
}

function renderToday() {
  todayBody.textContent = "";

  if (cycle.confrontingId) {
    const c = itemById(cycle.confrontingId);
    // A reload during the confrontation used to escape it and silently record
    // the lenient outcome. It now resumes exactly where it stopped.
    if (c && c.state === "live") { confront(c); return; }
    cycle.confrontingId = null;
  }

  const item = currentItem();
  if (item === null) { openCount() > 0 ? renderDayDone() : renderClosed(); }
  else { renderItem(item); }

  renderLedgerSafely();
}

// A thrown error in the ledger must not white out the screen above it.
function renderLedgerSafely() {
  try { renderLedger(); }
  catch (e) {
    ledgerBody.textContent = "";
    ledgerBody.appendChild(el("p", "empty", "The ledger could not be drawn."));
  }
}

function renderItem(item) {
  const h = el("h1", "eyebrow", "Today");
  h.tabIndex = -1;
  todayBody.appendChild(h);

  todayBody.appendChild(el("p", "action-line", item.action || item.title));

  // The consequence is the one thing the model is load-bearing for, and it was
  // collected then never shown. It is the evidence for the order.
  if (item.consequence) todayBody.appendChild(el("p", "because", item.consequence));
  if (item.blockedOn) todayBody.appendChild(el("p", "blocked", "Blocked on " + item.blockedOn));

  const controls = el("div", "row row-wide");
  controls.style.marginTop = "var(--s5)";

  const done = el("button", "btn btn-primary", "Done");
  done.addEventListener("click", () => {
    // Disable in place rather than on a timer: a second click on THIS button
    // used to settle the next-ranked item too, but a deliberate click on the
    // next one must not be swallowed. advance() replaces the button anyway.
    done.disabled = true;
    item.state = "done";
    advance();
  });

  const not = el("button", "btn", "Not today");
  not.addEventListener("click", () => {
    controls.remove();
    const rr = todayBody.appendChild(reasonRow(item));
    requestAnimationFrame(() => rr.classList.remove("entering"));
  });

  controls.appendChild(done);
  controls.appendChild(not);
  todayBody.appendChild(controls);

  const add = el("button", "add-new", "Something new");
  add.addEventListener("click", startAdd);
  todayBody.appendChild(add);
  h.focus();
}

/* Deferring now parks an item until tomorrow, so a day can run out before the
   cycle does. This is a state of Today, not a fourth screen. */
function renderDayDone() {
  const h = el("h1", "eyebrow", "Today");
  h.tabIndex = -1;
  todayBody.appendChild(h);
  todayBody.appendChild(el("p", "action-line", "Nothing left today."));
  const n = openCount();
  todayBody.appendChild(el("p", "because",
    n + (n === 1 ? " thread is still open" : " threads are still open") +
    ". You deferred them today; they come back tomorrow."));

  const add = el("button", "add-new", "Something new");
  add.addEventListener("click", startAdd);
  todayBody.appendChild(add);
  h.focus();
}

function reasonRow(item) {
  const box = el("div", "reason-row entering");
  box.style.marginTop = "var(--s5)";
  const h = el("p", "eyebrow", "Why not?");
  box.appendChild(h);

  const row = el("div", "row");
  ["Blocked", "No time", "Not real"].forEach(label => {
    const b = el("button", "btn", label);
    b.addEventListener("click", () => defer(item, label));
    row.appendChild(b);
  });
  box.appendChild(row);

  const typed = el("div", "row");
  typed.style.marginTop = "var(--s2)";
  const input = document.createElement("input");
  input.type = "text";
  input.setAttribute("aria-label", "Reason");
  input.placeholder = "or type one";
  input.style.flex = "1 1 12ch";
  const ok = el("button", "btn", "Save");
  ok.addEventListener("click", () => {
    const v = input.value.trim();
    if (v !== "") defer(item, v);
  });
  input.addEventListener("keydown", e => { if (e.key === "Enter") ok.click(); });
  typed.appendChild(input);
  typed.appendChild(ok);
  box.appendChild(typed);

  // A mis-tap on "Not today" used to have no exit that did not write a false
  // reason into a record whose whole value is that it is true.
  const cancel = el("button", "btn-link", "Never mind");
  cancel.addEventListener("click", () => renderToday());
  box.appendChild(cancel);

  return box;
}

// A double-tap must not count twice: two deferrals from one intent can jump an
// item from its first straight past its third, or fire two verdict calls.
let deferring = false;

async function defer(item, reason) {
  if (deferring) return;
  deferring = true;
  try {
    item.deferrals.push({ date: new Date().toISOString(), reason: reason });

    // The rule that makes it work: the third deferral does not advance. Commit
    // that we are confronting BEFORE the model call, so a reload during the
    // wait resumes the confrontation instead of escaping it.
    if (item.deferrals.length >= 3) {
      cycle.confrontingId = item.id;
      saveCycle();
      await confront(item);
      return;
    }
    saveCycle();
    advance();
  } finally {
    deferring = false;
  }
}

async function confront(item) {
  const head = () => {
    todayBody.textContent = "";
    const h = el("h1", "eyebrow", "Third deferral");
    h.tabIndex = -1;
    todayBody.appendChild(h);
    todayBody.appendChild(el("p", "action-line", item.action || item.title));
    return h;
  };

  head();
  const waiting = el("div", "verdict");
  waiting.setAttribute("data-waiting", "");
  waiting.appendChild(el("p", null, "Reading the reasons\u2026"));
  todayBody.appendChild(waiting);
  todayBody.setAttribute("aria-busy", "true");
  renderLedgerSafely();

  let out, reached = true;
  try {
    out = parseVerdict(await ask(SYS_VERDICT, JSON.stringify({
      title: item.title, action: item.action, blockedOn: item.blockedOn,
      consequence: item.consequence, deferrals: item.deferrals
    }), 1000, 45000));
  } catch (e) {
    // The model was never reached. Say so rather than dressing a canned
    // sentence in the same authority as a real judgement.
    reached = false;
    out = { verdict: "Deferred three times with no external blocker named.", recommend: "strike" };
    banner(todayBanner, rejectedKey(e)
      ? "That API key was rejected, so the model was not consulted. The line below is this app's default, not a judgement."
      : "The model could not be reached, so the line below is this app's default, not a judgement.");
  }
  todayBody.removeAttribute("aria-busy");

  const h = head();
  const v = el("div", "verdict");
  v.appendChild(el("p", null, out.verdict));
  v.appendChild(el("p", "rec", !reached ? "Default \u2014 the model was not reached."
    : out.recommend === "keep" ? "Reads as genuinely blocked." : "Reads as not a commitment."));
  todayBody.appendChild(v);

  const controls = el("div", "row row-wide");
  controls.style.marginTop = "var(--s4)";

  const finish = () => { cycle.confrontingId = null; saveCycle(); advance(); };

  const strike = el("button", "btn btn-warn", "Strike it");
  strike.addEventListener("click", () => {
    item.state = "struck";
    item.struckReason = reached ? out.verdict : "Struck by default \u2014 the model was not reached.";
    justStruckId = item.id;
    finish();
  });

  // Keeping used to be free, which made "carried" the cheapest word in the
  // ledger. It is the strongest claim in the app, so it now costs a name.
  const keep = el("button", "btn", "Keep, it's blocked on someone");
  keep.addEventListener("click", () => {
    controls.remove();
    const box = el("div");
    box.style.marginTop = "var(--s4)";
    box.appendChild(el("p", "eyebrow", "Who is holding this up?"));
    const row = el("div", "row row-wide");
    const who = document.createElement("input");
    who.type = "text";
    who.setAttribute("aria-label", "Who is holding this up");
    who.placeholder = "a name";
    who.value = item.blockedOn || "";
    who.style.flex = "1 1 12ch";
    const save = el("button", "btn", "Keep it");
    const commit = () => {
      const name = who.value.trim();
      if (name === "") { who.focus(); return; }
      item.blockedOn = name;
      item.state = "kept";
      finish();
    };
    save.addEventListener("click", commit);
    who.addEventListener("keydown", e => { if (e.key === "Enter") commit(); });
    row.appendChild(who); row.appendChild(save);
    box.appendChild(row);
    todayBody.appendChild(box);
    who.focus();
  });

  // Fixed order, always. This is the highest-stakes click in the app, and
  // buttons that move under the cursor are a mis-click generator. The
  // recommendation is carried by the line above, not by position; .row-wide
  // puts a real gap between them so a mis-aim cannot kill a commitment.
  controls.appendChild(strike);
  controls.appendChild(keep);
  todayBody.appendChild(controls);
  renderLedgerSafely();
  h.focus();
}

function renderClosed() {
  const done = cycle.items.filter(i => i.state === "done").length;
  const struck = cycle.items.filter(i => i.state === "struck").length;
  const carried = cycle.items.filter(i => i.state === "kept").length;

  const box = el("div", "closed");
  const h = el("h1", null, "Cycle closed. " + done + " done, " + struck + " struck, " + carried + " carried.");
  h.tabIndex = -1;
  box.appendChild(h);

  const b = el("button", "btn btn-primary btn-block", "Start a new cycle");
  b.addEventListener("click", () => {
    const carriedItems = cycle.items.filter(i => i.state === "kept");
    const closing = cycle;

    // Never delete the cycle before the archive write has actually landed.
    archive.unshift(closing);
    if (!write(K_ARCHIVE, archive)) {
      archive.shift();
      banner(todayBanner,
        "Out of storage — this cycle was not archived, so it has been left open. " +
        "Free some space and try again.");
      return;
    }

    // Carry the history, not just the words. Re-extracting carried items used
    // to hand every one of them a clean sheet, so anything could dodge the
    // three-deferral wall forever by riding the cycle boundary.
    carriedForward = carriedItems.map(i => ({
      action: i.action || i.title, deferrals: i.deferrals, blockedOn: i.blockedOn
    }));
    write(K_CARRIED, carriedForward);

    cycle = null;
    try { localStorage.removeItem(K_CYCLE); } catch (e) { /* ignore */ }

    dumpText.value = carriedItems.map(i => i.action || i.title).join("\n");
    banner(dumpBanner, carriedItems.length
      ? "Carried from the last cycle. Their deferral history comes with them."
      : "");
    banner(todayBanner, "");
    show("dump");
    dumpText.focus();
  });
  box.appendChild(b);
  todayBody.appendChild(box);
  h.focus();
}

const MARKS = {
  done:   { word: "done",   cls: "is-done" },
  struck: { word: "struck", cls: "is-struck" },
  kept:   { word: "kept",   cls: "is-kept" }
};

/* The ledger only ever gets shorter between resets. That is the point — but
   only if the marks differ. v2 ruled done and struck through identically, so a
   finished week and a collapsed one were the same page, and the accessible
   name of a completed item was indistinguishable from an untouched one. */
function renderLedger() {
  ledgerBody.textContent = "";
  let freshStrike = null;

  if (!cycle || cycle.orderedIds.length === 0) {
    ledgerBody.appendChild(el("p", "empty", "Nothing in this cycle. Start with a dump."));
    return;
  }

  const counts = { done: 0, struck: 0, kept: 0, live: 0 };
  cycle.orderedIds.forEach(id => {
    const it = itemById(id);
    if (it) counts[it.state] = (counts[it.state] || 0) + 1;
  });
  ledgerCount.textContent = counts.live + " open · " + counts.done + " done · " +
    counts.struck + " struck · " + counts.kept + " carried";

  const list = document.createElement("ul");
  list.className = "entries";

  cycle.orderedIds.forEach((id, idx) => {
    const item = itemById(id);
    if (!item) return;

    const row = document.createElement("li");
    row.className = "entry";
    const mark = MARKS[item.state];
    if (mark) row.classList.add("ruled", mark.cls);
    if (item.id === justStruckId) { row.classList.add("just-struck"); freshStrike = row; }
    if (idx === cycle.cursor && item.state === "live") row.classList.add("at");

    const line = el("span", "l");
    line.appendChild(el("span", "n", String(idx + 1).padStart(2, "0")));
    line.appendChild(document.createTextNode(item.title));
    row.appendChild(line);

    // State as a word, not only as a colour and a line.
    row.appendChild(el("span", "state", mark ? mark.word
      : (idx === cycle.cursor ? "today" : deferredToday(item) ? "deferred today" : "open")));

    if (item.state === "struck" && item.struckReason) {
      row.appendChild(el("span", "why", item.struckReason));
    } else if (item.state === "kept") {
      row.appendChild(el("span", "why", "Blocked on " + (item.blockedOn || "someone")));
    } else if (item.deferrals.length > 0) {
      const last = item.deferrals[item.deferrals.length - 1];
      // Her own words, given back to her. This is the evidence that decides
      // whether the deferral is still valid.
      row.appendChild(el("span", "why",
        item.deferrals.length + "\u00d7 deferred — last: " + last.reason));
    }

    list.appendChild(row);
  });

  ledgerBody.appendChild(list);

  if (freshStrike) {
    justStruckId = null;
    // Two frames: one to commit the un-struck start state, one to release it.
    requestAnimationFrame(() => {
      freshStrike.scrollIntoView({ block: "center", behavior: calmMotion() ? "auto" : "smooth" });
      requestAnimationFrame(() => freshStrike.classList.remove("just-struck"));
    });
  }
}

/* ============================================================
   boot
   ============================================================ */

const keyInput = document.getElementById("key-input");
document.getElementById("key-save").addEventListener("click", () => {
  const v = keyInput.value.trim();
  if (v === "") { keyInput.focus(); return; }
  settings = { apiKey: v, createdAt: new Date().toISOString() };
  if (!write(K_SETTINGS, settings)) {
    banner(keyBanner, "Could not save the key — this browser is out of storage.");
    return;
  }
  keyInput.value = "";
  banner(keyBanner, "");
  boot();
});
keyInput.addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("key-save").click();
});

function boot() {
  if (!settings || !settings.apiKey) { show("key"); return; }
  if (cycle && Array.isArray(cycle.orderedIds) && cycle.orderedIds.length > 0) {
    // A new day starts at the top of the spine. The order is the whole point;
    // resuming halfway down it would quietly re-rank by arrival time.
    if (!cycle.confrontingId && !availableNow(currentItem())) {
      cycle.cursor = nextOpen(-1);
      saveCycle();
    }
    show("today");
    renderToday();
    return;
  }
  // A cycle with items but no order was abandoned mid-sort; order it again.
  if (cycle && Array.isArray(cycle.items) && cycle.items.length > 0) { startOrdering(); return; }
  show("dump");
}

boot();
</script>
